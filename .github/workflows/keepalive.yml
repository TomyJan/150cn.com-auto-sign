name: Keep Scheduled Workflows Active

on:
  schedule:
    - cron: '23 3 1,15 * *'
  workflow_dispatch:

# Enable workflow schedules through the API; never create empty commits.
permissions:
  actions: write

concurrency:
  group: 150cn-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow enable auto-sign.yml --repo "$GH_REPO"
          gh workflow enable keepalive.yml --repo "$GH_REPO"
